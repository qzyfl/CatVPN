name: Build CatVPN Prebuilt Binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: linux-amd64
          - arch: arm64
            goarch: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Remove stray C file
        run: rm -f pow_alps.c

      - name: Build (${{ matrix.arch }})
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOPROXY: https://goproxy.cn,direct
        run: |
          mkdir -p dist
          go build -o dist/x-ui .
          chmod +x dist/x-ui
          echo "Build size: $(du -sh dist/x-ui)"

      - name: Package (${{ matrix.arch }})
        run: |
          cd dist
          tar czf "../x-mili-${{ matrix.goarch }}.tar.gz" x-ui
          sha256sum "../x-mili-${{ matrix.goarch }}.tar.gz" > "../x-mili-${{ matrix.goarch }}.sha256"

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.goarch }}
          path: |
            x-mili-${{ matrix.goarch }}.tar.gz
            x-mili-${{ matrix.goarch }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prebuilt-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
