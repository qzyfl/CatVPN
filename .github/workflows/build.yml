name: Build CatVPN Prebuilt Binaries

# 对齐 X-MILI 的"下载预编译"模型：
#   - 仅在 GitHub 托管的 amd64 runner 上构建 linux/amd64（CGO 启用），
#     与上游 X-MILI 一致，保证稳定可复现。
#   - arm64 / 其他架构由 install.sh 自动回退到源码编译（已内置）。
#   - 推送到 main 即重新发布到 tag `latest`（非 prerelease），
#     确保 install.sh 的 `releases/latest/download/x-mili-linux-amd64.tar.gz` 可命中。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Remove stray C file
        run: rm -f pow_alps.c

      - name: Build (linux/amd64, CGO)
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          GOPROXY: https://goproxy.cn,direct
        run: |
          mkdir -p dist
          go build -o dist/x-ui .
          chmod +x dist/x-ui
          echo "Build size: $(du -sh dist/x-ui)"

      - name: Package (linux/amd64)
        run: |
          cd dist
          tar czf "../x-mili-linux-amd64.tar.gz" x-ui
          sha256sum "../x-mili-linux-amd64.tar.gz" > "../x-mili-linux-amd64.sha256"
          ls -lh "../x-mili-linux-amd64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-linux-amd64
          path: |
            x-mili-linux-amd64.tar.gz
            x-mili-linux-amd64.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-linux-amd64
          path: artifacts

      - name: Publish / update Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CatVPN Prebuilt Binaries
          files: artifacts/*
          prerelease: false
          overwrite: true
          body: |
            CatVPN 预编译二进制（linux/amd64，CGO 启用）。
            install.sh 安装时自动下载此包；arm64 等架构自动回退源码编译。
