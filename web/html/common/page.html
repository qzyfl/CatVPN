{{ define "page/head_start" }}
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <!-- 页面切换 loading 遮罩：内联在最前面，JS 加载完之前就可见，消灭白屏+[Y]闪现 -->
  <style>
    /* 必须最先声明：v-cloak 在外部 CSS 解析前就生效 */
    [v-cloak] { display: none !important; }

    /* 全局页面 loading 遮罩 — 整页刷新期间显示，Vue mounted 后自动消失 */
    #catvpn-page-loader {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: #f5f5f5; color: #333;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity .25s ease;
    }
    #catvpn-page-loader.dark { background: #141414; color: rgba(255,255,255,.85); }
    #catvpn-page-loader.hidden { opacity: 0; pointer-events: none; }
    #catvpn-page-loader .spinner {
      width: 32px; height: 32px; border: 3px solid #e0e0e0;
      border-top-color: #008771; border-radius: 50%;
      animation: catvpn-spin .7s linear infinite;
    }
    #catvpn-page-loader.dark .spinner { border-color: rgba(255,255,255,.15); border-top-color: #00b090; }
    @keyframes catvpn-spin { to { transform: rotate(360deg); } }
    #catvpn-page-loader .loader-text { margin-left: 12px; font-size: 14px; font-weight: 500; }
  </style>
  {{/* 首屏关键资源预加载：提前并行拉取最重的 antd/vue，缩短面板首屏时间 */}}
  <link rel="preload" href="{{ .base_path }}assets/ant-design-vue/antd.min.css" as="style">
  <link rel="preload" href="{{ .base_path }}assets/vue/vue.min.js" as="script">
  <link rel="preload" href="{{ .base_path }}assets/ant-design-vue/antd.min.js" as="script">
  <link rel="stylesheet" href="{{ .base_path }}assets/ant-design-vue/antd.min.css">
  <link rel="stylesheet" href="{{ .base_path }}assets/css/custom.min.css?{{ .cur_ver }}">
  <link rel="icon" href="{{ .base_path }}assets/catvpn-logo.png">
  <link rel="icon" type="image/x-icon" href="{{ .base_path }}assets/catvpn-logo.ico">
  <style>

    /* vazirmatn-regular - arabic_latin_latin-ext */
    @font-face {
      font-display: swap;
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 400;
      src: url('{{ .base_path }}assets/Vazirmatn-UI-NL-Regular.woff2') format('woff2');
      unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE80-FEFC, U+0030-0039;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Vazirmatn', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    /* mobile touch scrolling for tabs */
    @media (max-width: 576px) {
      .ant-tabs-nav-container {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        overscroll-behavior-x: contain;
        white-space: nowrap;
        max-width: 100%;
        padding: 0 !important;
        /* Remove padding for arrows */
      }

      .ant-tabs-nav-wrap {
        overflow: visible !important;
        padding: 0 !important;
      }

      .ant-tabs-nav-scroll {
        overflow: visible !important;
        box-shadow: none !important;
      }

      .ant-tabs-nav {
        display: flex !important;
        transform: none !important;
        /* Disable JS transform */
        width: auto !important;
        margin: 0 !important;
      }

      .ant-tabs-tab-prev,
      .ant-tabs-tab-next {
        display: none !important;
        /* Hide arrows */
      }

      .ant-tabs-nav-container::-webkit-scrollbar {
        display: none;
      }
    }
  </style>
  <title>{{ .host }} – {{ i18n .title}}</title>
  {{ end }}

  {{ define "page/head_end" }}
</head>
{{ end }}

{{ define "page/body_start" }}

<body>
  <!-- 页面 loading 遮罩：整页刷新时立即显示，Vue mounted 后由 catvpnHideLoader() 消失 -->
  <div id="catvpn-page-loader">
    <div class="spinner"></div>
    <span class="loader-text">加载中...</span>
  </div>
  <div id="message"></div>
  {{ end }}

  {{ define "page/body_scripts" }}
  <script src="{{ .base_path }}assets/vue/vue.min.js?{{ .cur_ver }}"></script>
  <script src="{{ .base_path }}assets/moment/moment.min.js"></script>
  <script src="{{ .base_path }}assets/ant-design-vue/antd.min.js"></script>
  <script src="{{ .base_path }}assets/axios/axios.min.js?{{ .cur_ver }}"></script>
  <script src="{{ .base_path }}assets/qs/qs.min.js"></script>
  <script src="{{ .base_path }}assets/js/axios-init.js?{{ .cur_ver }}"></script>
  <script src="{{ .base_path }}assets/js/util/index.js?{{ .cur_ver }}"></script>
  <script>
    const basePath = '{{ .base_path }}';
    axios.defaults.baseURL = basePath;
  </script>
  <script src="{{ .base_path }}assets/js/websocket.js?{{ .cur_ver }}"></script>
  <script>
  /* SPA-lite 导航：点击菜单不再整页刷新，只换 #app 内容 + 重跑内联脚本，
     避免每次重新解析 2-3MB JS（antd/vue 等）。任何异常自动回退整页刷新。 */
  function catvpnLoadScript(src) {
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = src;
      sc.onload = function () { resolve(); };
      sc.onerror = function () { reject(new Error('script load failed: ' + src)); };
      document.head.appendChild(sc);
    });
  }
  function catvpnScriptAlreadyLoaded(src) {
    return !!document.querySelector('script[src="' + src.replace(/["\\]/g, '\\$&') + '"]');
  }
  window.catvpnNavigate = async function (targetUrl) {
    try {
      var loader = document.getElementById('catvpn-page-loader');
      if (!loader) {
        loader = document.createElement('div');
        loader.id = 'catvpn-page-loader';
        loader.innerHTML = '<div class="spinner"></div><span class="loader-text">加载中...</span>';
        document.body.appendChild(loader);
      }
      loader.classList.remove('hidden');

      var resp = await fetch(targetUrl, {
        credentials: 'same-origin',
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
      var html = await resp.text();
      var doc = new DOMParser().parseFromString(html, 'text/html');

      var newApp = doc.querySelector('#app');
      if (!newApp) throw new Error('no #app in response');
      var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));

      // 外部脚本(如 codemirror, 仅 xray 页)按需加载, 已加载则跳过
      for (var i = 0; i < scripts.length; i++) {
        var s = scripts[i];
        if (s.src && !catvpnScriptAlreadyLoaded(s.src)) {
          await catvpnLoadScript(s.src);
        }
      }

      // 销毁旧 app + 清理 websocket 监听器 + 断开, 防止泄漏
      if (window.__catvpnApp) {
        try { window.__catvpnApp.$destroy(); } catch (e) {}
        window.__catvpnApp = null;
      }
      if (window.wsClient) {
        try { if (window.wsClient.listeners && window.wsClient.listeners.clear) window.wsClient.listeners.clear(); } catch (e) {}
        try { window.wsClient.disconnect(); } catch (e) {}
      }

      // 替换 #app(含新页面正确的 sidebar activeTab, 服务端已渲染)
      var oldApp = document.querySelector('#app');
      oldApp.outerHTML = newApp.outerHTML;

      // 合并内联脚本为一块执行(const 共享作用域; Vue.component 仍全局注册)
      var inlineCode = '';
      for (var j = 0; j < scripts.length; j++) {
        var ss = scripts[j];
        if (!ss.src && ss.textContent && ss.textContent.trim()) {
          inlineCode += '\n;(function(){\n' + ss.textContent + '\n})();\n';
        }
      }
      // 间接 eval：在全局作用域执行, 页面脚本可访问顶层 const(basePath 等) 与全局 Vue/antd
      if (inlineCode) (0, eval)(inlineCode);

      if (doc.title) document.title = doc.title;
      history.pushState({ catvpn: true }, '', targetUrl);
      if (window.catvpnHideLoader) window.catvpnHideLoader();
      else loader.classList.add('hidden');
    } catch (e) {
      console.error('[catvpnNavigate] failed, fallback to full reload:', e);
      window.location.href = targetUrl;
    }
  };
  // 浏览器前进/后退：直接整页刷新, 简单可靠
  window.addEventListener('popstate', function (e) {
    if (e.state && e.state.catvpn) window.location.reload();
  });
  </script>
  {{ end }}

  {{ define "page/body_end" }}
<script>
/* 全局 loading 遮罩控制：Vue mounted 后调用 catvpnHideLoader() 消除白屏 */
(function() {
  var el = document.getElementById('catvpn-page-loader');
  if (!el) return;
  /* 跟随系统/已存储的主题 */
  try {
    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches))
      el.classList.add('dark');
  } catch(e) {}
  /* 安全网：3 秒后强制消失（防止某个页面忘记调用 hideLoader） */
  var done = false;
  function hide() {
    if (done) return;
    done = true;
    el.classList.add('hidden');
    setTimeout(function() { el.remove(); }, 300);
  }
  window.catvpnHideLoader = hide;
  setTimeout(hide, 3000);
})();
</script>
</body>

</html>
{{ end }}
